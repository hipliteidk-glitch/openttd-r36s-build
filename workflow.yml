name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev libpng-dev zlib1g-dev liblzma-dev libfreetype-dev libfontconfig-dev libfluidsynth-dev libicu-dev
      - name: source
        run: curl -sL -o o.tar.xz https://cdn.openttd.org/openttd-releases/14.1/openttd-14.1-source.tar.xz && tar xf o.tar.xz
      - name: configure
        run: cd openttd-14.1 && cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPTION_DEDICATED=OFF -DOPTION_USE_ASSERTS=OFF
      - name: build
        run: cmake --build openttd-14.1/build -j4
      - name: stage
        run: mkdir -p out/baseset && cp openttd-14.1/build/openttd out/ && file out/openttd
      - name: assets
        run: curl -sL -o g.zip https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip && curl -sL -o s.zip https://cdn.openttd.org/opensfx-releases/1.0.3/opensfx-1.0.3-all.zip && curl -sL -o m.zip https://cdn.openttd.org/openmsx-releases/0.4.2/openmsx-0.4.2-all.zip && unzip -o g.zip -d out/baseset && unzip -o s.zip -d out/baseset && unzip -o m.zip -d out/baseset
      - uses: actions/upload-artifact@v4
        with:
          name: openttd-aarch64
          path: out
